name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package ZIP and DMG
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/make-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
