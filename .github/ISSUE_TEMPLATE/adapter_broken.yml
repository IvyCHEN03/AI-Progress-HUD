name: Provider adapter broken
description: Report a website or desktop UI change that broke state detection
title: "[Adapter]: "
labels: ["adapter", "needs-triage"]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [ChatGPT, Claude, Codex, DeepSeek, Yuanbao, New provider]
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Chromium webpage, macOS desktop app, Codex local thread]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and locale
      placeholder: "Chrome 138, website UI in zh-CN"
    validations:
      required: true
  - type: dropdown
    id: expected_state
    attributes:
      label: Expected state
      options: [Standby, Thinking, Streaming, Completed, Needs action, Error, Disconnected]
    validations:
      required: true
  - type: input
    id: observed_state
    attributes:
      label: Observed HUD state
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Describe visible controls or attach a screenshot with all conversation and account information removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include prompts, responses, cookies, tokens, or private account data.
          required: true
